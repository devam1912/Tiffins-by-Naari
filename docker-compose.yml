version: '3.8'

services:
  # Database Service
  mongodb:
    image: mongo:latest
    container_name: tiffins_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: tiffins_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/tiffinsDB

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Pass the backend API URL to the Vite build process
        - VITE_API_URL=http://localhost:5000/api
    container_name: tiffins_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
